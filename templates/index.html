<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инкассаторские маршруты — Москва</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --blue-deep: #0b4566;
        --blue-mid: #1f779e;
        --blue-light: #a3c9db;
        --accent: #4a9eb5;
        --red: #cc6b4d;
        --yellow: #d4a843;
        --green: #4caf7d;
        --text-dark: #0a2f3f;
        --text-mid: #2d5569;
        --text-muted: #6b8899;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Montserrat', sans-serif;
        min-height: 100vh;
        background: linear-gradient(165deg, #0b4566 0%, #154f6c 30%, #2e8ab8 70%, #a3c9db 100%);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
    }

    .main-container {
        background: rgba(255,255,255,0.97);
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.6);
        padding: 55px 50px 45px;
        max-width: 720px;
        width: 100%;
        text-align: center;
        position: relative;
    }

    .accent-line {
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 70px; height: 4px;
        background: linear-gradient(90deg, #9adfd0, #6bc0d4, #4a9eb5);
        border-radius: 0 0 5px 5px;
    }

    .icon { font-size: 52px; margin-bottom: 20px; display: inline-block; }

    h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 44px; font-weight: 600;
        color: var(--text-dark);
        letter-spacing: 1.5px; margin-bottom: 8px;
    }

    .title-divider {
        width: 50px; height: 2px;
        background: linear-gradient(90deg, transparent, #8cc9c7, #4a9eb5, #8cc9c7, transparent);
        margin: 18px auto 14px; border-radius: 1px;
    }

    .subtitle {
        font-size: 13px; font-weight: 400;
        color: var(--text-muted);
        margin-bottom: 32px;
        letter-spacing: 2.5px; text-transform: uppercase;
    }

    /* ATM stats */
    .atm-stats {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
    }

    .atm-stat-card {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 50px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
        background: #f4f9fb;
        border: 1.5px solid #e1eef4;
        color: var(--text-mid);
    }

    .atm-stat-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .atm-stat-dot.red    { background: var(--red); }
    .atm-stat-dot.yellow { background: var(--yellow); }
    .atm-stat-dot.green  { background: var(--green); }

    /* Day selector */
    .day-selector {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 28px;
    }

    .day-btn {
        background: transparent;
        border: 1.5px solid #c5dce8;
        color: var(--text-mid);
        padding: 9px 22px;
        font-family: 'Montserrat', sans-serif;
        font-size: 12px; font-weight: 500;
        cursor: pointer;
        border-radius: 50px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: all 0.25s ease;
    }

    .day-btn:hover {
        border-color: var(--blue-mid);
        color: var(--blue-mid);
        background: rgba(31,119,158,0.05);
    }

    .day-btn.active {
        background: var(--blue-mid);
        border-color: var(--blue-mid);
        color: #fff;
        box-shadow: 0 6px 18px rgba(31,119,158,0.3);
    }

    /* Build button */
    .build-button {
        background: linear-gradient(135deg, #1f779e 0%, #1d688a 100%);
        border: none; color: #fff;
        padding: 17px 52px;
        font-family: 'Montserrat', sans-serif;
        font-size: 13px; font-weight: 500;
        cursor: pointer; border-radius: 50px;
        letter-spacing: 2.5px; text-transform: uppercase;
        box-shadow: 0 10px 25px -5px rgba(26,95,122,0.4);
        transition: all 0.4s cubic-bezier(0.2,0.8,0.2,1);
        margin-bottom: 32px;
        position: relative; overflow: hidden;
    }

    .build-button::after {
        content: '';
        position: absolute; top: 50%; left: 50%;
        width: 0; height: 0;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        transform: translate(-50%,-50%);
        transition: width 0.7s, height 0.7s;
    }

    .build-button:hover::after { width: 350px; height: 350px; }

    .build-button:hover {
        background: linear-gradient(135deg, #2c3e50 0%, #1a2d3b 100%);
        transform: translateY(-3px);
    }

    .build-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    /* Loading spinner */
    .spinner {
        display: none;
        width: 20px; height: 20px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 24px;
    }

    .spinner.show { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error box */
    .error-box {
        display: none;
        background: #fff5f3;
        border: 1px solid #f5c6c0;
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #8b2a1a;
        text-align: left;
    }

    .error-box.show { display: block; }

    /* Result box */
    .result-box {
        display: none;
        background: #fff;
        border: 1px solid #e7f0f4;
        border-radius: 20px;
        padding: 28px 32px;
        margin-top: 5px;
        text-align: left;
        animation: fadeSlideIn 0.5s cubic-bezier(0.2,0.8,0.2,1);
        box-shadow: 0 8px 20px rgba(0,40,60,0.04);
    }

    .result-box.show { display: block; }

    @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e8f0f4;
    }

    .result-title {
        font-size: 14px; font-weight: 600;
        color: var(--text-dark);
        letter-spacing: 0.5px;
    }

    .export-btn {
        font-size: 11px; font-weight: 600;
        color: var(--blue-mid);
        background: transparent;
        border: 1.5px solid #c5dce8;
        padding: 4px 12px; border-radius: 20px;
        letter-spacing: 1px; cursor: pointer;
        transition: all 0.2s;
        font-family: 'Montserrat', sans-serif;
    }

    .export-btn:hover {
        background: var(--blue-mid);
        border-color: var(--blue-mid);
        color: #fff;
    }

    .result-day-badge {
        font-size: 11px; font-weight: 600;
        color: var(--blue-mid);
        background: rgba(31,119,158,0.08);
        padding: 4px 12px; border-radius: 20px;
        letter-spacing: 1px; text-transform: uppercase;
    }

    .result-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 6px;
        border-bottom: 1px solid #f4f8fb;
        font-size: 14px; font-weight: 400;
        color: var(--text-mid);
        transition: background 0.2s, padding-left 0.2s;
        border-radius: 8px;
        margin-bottom: 2px;
        cursor: pointer;
    }

    .result-item:hover { background: #f8fbfd; padding-left: 12px; }
    .result-item.active { background: rgba(31,119,158,0.07); padding-left: 12px; }

    /* Detail panel */
    .detail-panel {
        display: none;
        margin-top: 12px;
        background: #f8fbfd;
        border-radius: 12px;
        border: 1px solid #e1eef4;
        overflow: hidden;
    }

    .detail-panel.show { display: block; }

    .detail-panel-header {
        padding: 10px 16px;
        font-size: 12px; font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 1px; text-transform: uppercase;
        border-bottom: 1px solid #e1eef4;
        background: #f0f7fa;
    }

    .detail-stop {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        font-size: 13px;
        color: var(--text-mid);
        border-bottom: 1px solid #eef4f7;
    }

    .detail-stop:last-child { border-bottom: none; }

    .detail-stop-num {
        font-size: 11px; font-weight: 600;
        color: var(--text-muted);
        width: 20px; text-align: right;
        flex-shrink: 0;
    }

    .detail-stop-id { font-weight: 500; color: var(--text-dark); }

    .detail-stop-status {
        margin-left: auto;
        font-size: 11px; font-weight: 600;
        padding: 2px 10px; border-radius: 20px;
        letter-spacing: 0.5px;
    }

    .detail-stop-status.RED    { background: #fde8e3; color: #8b2a1a; }
    .detail-stop-status.YELLOW { background: #fef6e0; color: #7a5a00; }
    .detail-stop-status.GREEN  { background: #e5f6ed; color: #1a6b3a; }

    /* Skeleton loader */
    @keyframes shimmer {
        0%   { background-position: -400px 0; }
        100% { background-position:  400px 0; }
    }

    .skeleton {
        background: linear-gradient(90deg, #e8f0f4 25%, #f4f9fb 50%, #e8f0f4 75%);
        background-size: 800px 100%;
        animation: shimmer 1.4s infinite linear;
        border-radius: 6px;
    }

    .skeleton-stop {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid #eef4f7;
    }

    .skeleton-stop:last-child { border-bottom: none; }

    .skeleton-num  { width: 20px; height: 12px; flex-shrink: 0; }
    .skeleton-id   { width: 120px; height: 13px; }
    .skeleton-badge { width: 60px; height: 20px; border-radius: 20px; margin-left: auto; }

    .result-icon { font-size: 22px; width: 30px; text-align: center; }

    .result-item strong { font-weight: 600; color: var(--text-dark); }

    .result-meta {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
    }

    /* Stats row */
    .stats-row {
        display: flex;
        gap: 12px;
        margin-top: 18px;
    }

    .stat-card {
        flex: 1;
        background: #f8fbfd;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
    }

    .stat-value {
        font-size: 22px; font-weight: 600;
        color: var(--text-dark);
        font-family: 'Cormorant Garamond', serif;
    }

    .stat-label {
        font-size: 10px; font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 1.5px; text-transform: uppercase;
        margin-top: 4px;
    }

    /* Critical alert */
    .critical-alert {
        margin-top: 18px;
        padding: 14px 18px;
        background: #fefaf7;
        border-radius: 12px;
        border-left: 4px solid var(--red);
        font-size: 13px; font-weight: 500;
        color: #8b422a;
        display: flex; align-items: center; gap: 12px;
    }

    .critical-dot {
        width: 9px; height: 9px;
        background: var(--red); border-radius: 50%;
        flex-shrink: 0;
        animation: pulse 2.2s ease-in-out infinite;
        box-shadow: 0 0 0 2px rgba(204,107,77,0.2);
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.5); }
    }

    /* Map area */
    .map-area {
        display: none;
        margin-top: 24px;
        border-radius: 20px;
        overflow: hidden;
        border: 2px solid #e1eef4;
        animation: fadeSlideIn 0.55s cubic-bezier(0.2,0.8,0.2,1);
        box-shadow: 0 6px 22px rgba(0,40,60,0.05);
    }

    .map-area.show { display: block; }

    .map-area iframe {
        width: 100%;
        height: 380px;
        border: none;
        display: block;
    }


    .footer {
        margin-top: 32px;
        font-size: 11px; font-weight: 400;
        color: #8aaebb;
        letter-spacing: 2px; text-transform: uppercase;
    }

    .empty-day {
        text-align: center;
        padding: 24px;
        color: var(--text-muted);
        font-size: 13px;
    }

    /* Compare table */
    .compare-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
        font-size: 13px;
    }

    .compare-table th {
        font-size: 11px; font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 1.5px; text-transform: uppercase;
        padding: 8px 12px;
        border-bottom: 2px solid #e1eef4;
        text-align: center;
    }

    .compare-table th:first-child { text-align: left; }

    .compare-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #f0f7fa;
        color: var(--text-mid);
        text-align: center;
    }

    .compare-table td:first-child {
        font-weight: 600;
        color: var(--text-dark);
        text-align: left;
    }

    .compare-table tr:last-child td { border-bottom: none; }

    .compare-table tr.highlight { background: rgba(31,119,158,0.05); }

    .compare-badge {
        display: inline-block;
        font-size: 10px; font-weight: 700;
        padding: 2px 8px; border-radius: 20px;
        letter-spacing: 0.5px; margin-left: 6px;
        vertical-align: middle;
    }

    .compare-badge.max { background: #fde8e3; color: #8b2a1a; }
    .compare-badge.min { background: #e5f6ed; color: #1a6b3a; }
</style>
</head>
<body>
<div class="main-container">
    <div class="accent-line"></div>
    <div class="icon">🚚</div>
    <h1>Маршруты инкассаторов</h1>
    <div class="title-divider"></div>
    <p class="subtitle">Москва &nbsp;·&nbsp; 1000 банкоматов &nbsp;·&nbsp; 5 машин</p>

    <!-- Статистика банкоматов -->
    <div class="atm-stats" id="atmStats"></div>

    <!-- Сравнение дней -->
    <div class="compare-table" id="compareTable" style="display:none"></div>

    <!-- Выбор дня -->
    <div class="day-selector">
        <button class="day-btn" data-day="1">День 1</button>
        <button class="day-btn active" data-day="2">День 2</button>
        <button class="day-btn" data-day="3">День 3</button>
    </div>

    <button class="build-button" id="btnBuildRoute">Построить маршрут</button>
    <button class="export-btn" id="btnExport" style="display:none;margin:-20px auto 28px;">↓ Скачать CSV</button>

    <div class="spinner" id="spinner"></div>

    <div class="error-box" id="errorBox"></div>

    <!-- Результаты -->
    <div class="result-box" id="resultBox">
        <div class="result-header">
            <div class="result-title">Построенные маршруты</div>
            <div class="result-day-badge" id="dayBadge">День 2</div>
        </div>
        <div id="routesList"></div>
        <div class="stats-row" id="statsRow"></div>
        <div class="critical-alert" id="criticalAlert" style="display:none">
            <span class="critical-dot"></span>
            <span id="criticalText"></span>
        </div>
    </div>

    <!-- Карта -->
    <div class="map-area" id="mapArea">
        <iframe id="mapFrame" src="" title="Карта маршрутов"></iframe>
    </div>

    <p class="footer">РЭУ им. Г. В. Плеханова &nbsp;·&nbsp; 2026</p>
</div>

<script>
    const ICONS = ['🚗','🚙','🚐','🚛','🚎'];
    let selectedDay = 2;

    // Выбор дня
    document.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedDay = parseInt(this.dataset.day);
        });
    });

    document.getElementById('btnBuildRoute').addEventListener('click', buildRoutes);

    document.getElementById('btnExport').addEventListener('click', () => {
        window.location.href = `/api/routes/export?day=${selectedDay}`;
    });

    async function buildRoutes() {
        const btn = document.getElementById('btnBuildRoute');
        const spinner = document.getElementById('spinner');
        const errorBox = document.getElementById('errorBox');
        const resultBox = document.getElementById('resultBox');
        const mapArea = document.getElementById('mapArea');

        // Сброс
        btn.disabled = true;
        btn.textContent = 'Загрузка...';
        spinner.classList.add('show');
        errorBox.classList.remove('show');
        resultBox.classList.remove('show');
        mapArea.classList.remove('show');

        try {
            const resp = await fetch(`/api/routes/all?day=${selectedDay}`);
            if (!resp.ok) throw new Error(`Сервер вернул ${resp.status}`);
            const data = await resp.json();

            if (data.error) throw new Error(data.error);

            renderResults(data, selectedDay);
            renderMap(selectedDay);
            document.getElementById('btnExport').style.display = 'inline-block';

        } catch (err) {
            errorBox.textContent = `Ошибка: ${err.message}`;
            errorBox.classList.add('show');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Обновить маршрут';
            spinner.classList.remove('show');
        }
    }

    function formatTime(minutes) {
        const h = Math.floor(minutes / 60);
        const m = Math.round(minutes % 60);
        if (h === 0) return `${m} мин`;
        return `${h} ч ${m} мин`;
    }

    function renderResults(routes, day) {
        const resultBox = document.getElementById('resultBox');
        const routesList = document.getElementById('routesList');
        const statsRow = document.getElementById('statsRow');
        const criticalAlert = document.getElementById('criticalAlert');
        const criticalText = document.getElementById('criticalText');
        const dayBadge = document.getElementById('dayBadge');

        dayBadge.textContent = `День ${day}`;

        if (!routes || routes.length === 0) {
            routesList.innerHTML = '<div class="empty-day">Маршруты для этого дня не сгенерированы</div>';
            statsRow.innerHTML = '';
            criticalAlert.style.display = 'none';
            resultBox.classList.add('show');
            return;
        }

        // Список машин
        routesList.innerHTML = routes.map((r, i) => `
            <div class="result-item" data-car="${r.car}">
                <span class="result-icon">${ICONS[i % ICONS.length]}</span>
                <span><strong>Машина ${r.car}</strong> &nbsp;—&nbsp; ${r.stops} банкоматов</span>
                <span class="result-meta">${formatTime(r.total_time)}</span>
            </div>
            <div class="detail-panel" id="detail-car-${r.car}"></div>
        `).join('');

        routesList.querySelectorAll('.result-item').forEach(item => {
            item.addEventListener('click', () => loadCarDetail(item, day));
        });

        // Итоговая статистика
        const totalAtms = routes.reduce((s, r) => s + r.stops, 0);
        const totalCritical = routes.reduce((s, r) => s + r.critical_count, 0);
        const avgTime = routes.reduce((s, r) => s + r.total_time, 0) / routes.length;

        statsRow.innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${totalAtms}</div>
                <div class="stat-label">Банкоматов</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${routes.length}</div>
                <div class="stat-label">Машин</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${formatTime(avgTime)}</div>
                <div class="stat-label">Среднее время</div>
            </div>
        `;

        // Критические
        if (totalCritical > 0) {
            criticalText.textContent = `Критических банкоматов: ${totalCritical} — требуется срочный объезд`;
            criticalAlert.style.display = 'flex';
        } else {
            criticalAlert.style.display = 'none';
        }

        resultBox.classList.add('show');
    }

    function renderMap(day) {
        const mapArea = document.getElementById('mapArea');
        const mapFrame = document.getElementById('mapFrame');
        mapFrame.src = `/map_day${day}`;
        mapArea.classList.add('show');
    }

    async function loadAtmStats() {
        const box = document.getElementById('atmStats');
        try {
            const resp = await fetch('/api/atms/stats');
            if (!resp.ok) return;
            const d = await resp.json();
            if (d.error) return;
            box.innerHTML = `
                <div class="atm-stat-card"><span class="atm-stat-dot red"></span>${d.red} критических</div>
                <div class="atm-stat-card"><span class="atm-stat-dot yellow"></span>${d.yellow} внимание</div>
                <div class="atm-stat-card"><span class="atm-stat-dot green"></span>${d.green} в норме</div>
            `;
        } catch (_) {}
    }

    const STATUS_LABEL = { RED: 'Критично', YELLOW: 'Внимание', GREEN: 'Норма', UNKNOWN: '—' };

    async function loadCarDetail(item, day) {
        const car = item.dataset.car;
        const panel = document.getElementById(`detail-car-${car}`);

        if (panel.classList.contains('show')) {
            panel.classList.remove('show');
            item.classList.remove('active');
            return;
        }

        routesList.querySelectorAll('.result-item').forEach(el => el.classList.remove('active'));
        routesList.querySelectorAll('.detail-panel').forEach(el => el.classList.remove('show'));

        item.classList.add('active');
        panel.innerHTML = `
            <div class="detail-panel-header">Загрузка маршрута...</div>
            ${Array.from({length: 5}, () => `
                <div class="skeleton-stop">
                    <div class="skeleton skeleton-num"></div>
                    <div class="skeleton skeleton-id"></div>
                    <div class="skeleton skeleton-badge"></div>
                </div>
            `).join('')}
        `;
        panel.classList.add('show');

        try {
            const resp = await fetch(`/api/routes/detail?day=${day}&car=${car}`);
            if (!resp.ok) throw new Error(`Ошибка ${resp.status}`);
            const stops = await resp.json();

            panel.innerHTML = `
                <div class="detail-panel-header">Маршрут машины ${car} — ${stops.length} банкоматов</div>
                ${stops.map(s => `
                    <div class="detail-stop">
                        <span class="detail-stop-num">${s.order}</span>
                        <span class="detail-stop-id">Банкомат #${s.atm_id ?? '—'}</span>
                        <span class="detail-stop-status ${s.status}">${STATUS_LABEL[s.status] ?? s.status}</span>
                    </div>
                `).join('')}
            `;
        } catch (err) {
            panel.innerHTML = `<div class="detail-panel-header">Ошибка: ${err.message}</div>`;
        }
    }

    async function loadCompare() {
        try {
            const resp = await fetch('/api/routes/compare');
            if (!resp.ok) return;
            const days = await resp.json();
            if (!days.length) return;

            const maxAtms     = Math.max(...days.map(d => d.atms));
            const minAtms     = Math.min(...days.map(d => d.atms));
            const maxCritical = Math.max(...days.map(d => d.critical));
            const maxTime     = Math.max(...days.map(d => d.avg_time));

            const rows = days.map(d => {
                const atmBadge      = d.atms === maxAtms && maxAtms > 0     ? '<span class="compare-badge max">макс</span>' :
                                      d.atms === minAtms && days.length > 1  ? '<span class="compare-badge min">мин</span>' : '';
                const critBadge     = d.critical === maxCritical && maxCritical > 0 ? '<span class="compare-badge max">макс</span>' : '';
                const timeBadge     = d.avg_time === maxTime && maxTime > 0  ? '<span class="compare-badge max">макс</span>' : '';
                const isHighlight   = d.atms === maxAtms || d.critical === maxCritical;

                return `
                    <tr${isHighlight ? ' class="highlight"' : ''}>
                        <td>День ${d.day}</td>
                        <td>${d.cars}</td>
                        <td>${d.atms}${atmBadge}</td>
                        <td>${d.critical}${critBadge}</td>
                        <td>${formatTime(d.avg_time)}${timeBadge}</td>
                    </tr>
                `;
            }).join('');

            const box = document.getElementById('compareTable');
            box.innerHTML = `
                <table class="compare-table">
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>Машин</th>
                            <th>Банкоматов</th>
                            <th>Критических</th>
                            <th>Среднее время</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
            box.style.display = 'block';
        } catch (_) {}
    }

    loadAtmStats();
    loadCompare();
    buildRoutes();
</script>
</body>
</html>
