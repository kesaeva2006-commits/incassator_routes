name: Build routes and maps

# Когда запускать робота:
on:
  workflow_dispatch:        # вручную — кнопкой "Run workflow" на вкладке Actions
  push:
    branches: [ "develop" ] # автоматически — при изменениях в develop

# Разрешаем роботу записывать файлы обратно в репозиторий
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - uses: actions/checkout@v4

      # 2. Ставим Python (та же версия, что в тестах)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Ставим лёгкие зависимости для сборки (без osmnx — он не нужен в быстром режиме)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-build.txt

      # 4. Собираем маршруты: atms.json -> routes.json
      - name: Build routes.json
        run: python build_routes.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      # 5. Генерируем карты по дням: routes.json -> map_day1/2/3.html (в templates/)
      - name: Generate maps
        run: python generate_map.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      # 6. Робот сам коммитит сгенерированные файлы обратно в репозиторий
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add routes.json templates/map_day1.html templates/map_day2.html templates/map_day3.html
          git diff --staged --quiet || git commit -m "auto: пересборка routes.json и карт [skip ci]"
          git push
